services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: sagtrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请在 TEST/.env 中设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 TEST/.env 中设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 TEST/.env 中设置 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - sagtrag_demo_pgdata:/var/lib/postgresql
      - ./TEST/init/001-enable-pgvector.sql:/docker-entrypoint-initdb.d/001-enable-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - sagtrag_demo

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    container_name: sagtrag-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?请在 TEST/.env 中设置 RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?请在 TEST/.env 中设置 RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - sagtrag_demo_rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - sagtrag_demo

  object-store:
    image: chrislusf/seaweedfs:4.48
    container_name: sagtrag-object-store
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OBJECT_STORE_PORT:-8333}:8333"
    volumes:
      - sagtrag_demo_objectdata:/data
      - ./TEST/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - sagtrag_demo

  redis:
    image: redis:7.2.17-bookworm
    container_name: sagtrag-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 TEST/.env 中设置 REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请在 TEST/.env 中设置 REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - sagtrag_demo_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - sagtrag_demo

volumes:
  sagtrag_demo_pgdata:
    name: sagtrag_demo_pgdata
  sagtrag_demo_rabbitmqdata:
    name: sagtrag_demo_rabbitmqdata
  sagtrag_demo_objectdata:
    name: sagtrag_demo_objectdata
  sagtrag_demo_redisdata:
    name: sagtrag_demo_redisdata

networks:
  sagtrag_demo:
    name: sagtrag_demo
