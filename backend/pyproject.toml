[project]
name = "sagtrag-backend"
version = "0.1.0"
description = "Enterprise WeCom RAG identity and authorization foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "cryptography>=43,<47",
  "defusedxml>=0.7,<1",
  "aio-pika>=9.4,<10",
  "redis>=5,<7",
  "aioboto3>=13,<16",
  "imageio-ffmpeg==0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
eval = [
    "ragas==0.4.3",
    "langchain>=0.3,<1",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.3,<1",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

